# Despliegue del sistema a Hostinger, en el subdominio de sin_excusas:
# https://sistema.sinexcusas.org.pe  →  public_html/sistema
#
# Se ejecuta en cada push a `main` (o a mano desde la pestaña Actions):
#   1. instala las dependencias PHP de producción (vendor/),
#   2. compila la SPA con Vite (public/build/),
#   3. empaqueta todo en un único release.zip,
#   4. lo sube por FTP y le pide al servidor que lo descomprima, migre y cachee.
#
# Por qué un zip y no una subida archivo por archivo: vendor/ son miles de
# archivos y el FTP de Hostinger cierra la sesión a los 3600 segundos, así que
# la subida nunca llegaba al final. Un zip son dos minutos.
#
# Lo que NO hace (ver DEPLOY.md, se hace una sola vez):
#   - crear la base de datos y el .env del servidor,
#   - generar APP_KEY,
#   - sembrar roles y usuario administrador,
#   - crear el enlace public/storage.
name: Deploy a sistema.sinexcusas.org.pe

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos pushes seguidos, el segundo espera: dos publicaciones a la vez
# dejarían la carpeta a medias.
concurrency:
  group: deploy-sistema
  cancel-in-progress: false

env:
  # Prefijo de la URL si la app no se sirve en la raíz de su dominio. Vite lo
  # escribe en las rutas de los chunks (/prefijo/build/…). En el subdominio
  # va vacío; solo cambia si algún día se sirve como dominio.com/carpeta.
  ASSET_URL: ''
  # Carpeta donde se sube el paquete, relativa a la raíz de la cuenta FTP. La
  # cuenta u367943235.sistema ya apunta a public_html/sistema, así que va vacío.
  FTP_DIR: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Comprobar que están los secretos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          faltan=""
          for secreto in FTP_SERVER FTP_USERNAME FTP_PASSWORD DEPLOY_TOKEN DEPLOY_URL; do
            if [ -z "${!secreto}" ]; then faltan="$faltan $secreto"; fi
          done
          if [ -n "$faltan" ]; then
            echo "Faltan estos secretos en GitHub (Settings → Secrets → Actions):$faltan"
            echo "Sin ellos el servidor no puede publicar la versión. Ver DEPLOY.md."
            exit 1
          fi

      - name: Descargar el código
        uses: actions/checkout@v4

      # La misma versión que corre el subdominio en Hostinger (8.2.33). vendor/
      # se instala aquí, así que no puede pedir un PHP más nuevo que el servidor.
      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, gd, pdo_mysql, zip, exif
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias PHP (sin dev)
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar la SPA (Vite)
        run: |
          npm ci
          npm run build

      - name: Empaquetar la versión
        # Se copia a una carpeta aparte para no arrastrar lo que no va al
        # servidor, y se comprime desde dentro para que las rutas del zip
        # queden relativas a la raíz del proyecto.
        run: |
          rsync -a --exclude-from=.deployignore ./ /tmp/release/
          cd /tmp/release
          zip -rq "$GITHUB_WORKSPACE/release.zip" . -x '.git/*'
          cd "$GITHUB_WORKSPACE"
          echo "Paquete: $(du -h release.zip | cut -f1), $(unzip -l release.zip | tail -1 | awk '{print $2}') archivos"

      - name: Subir el paquete por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # --ssl cifra la sesión si el servidor lo admite y continúa en claro si
        # no; --ftp-pasv es lo que espera Hostinger detrás de su cortafuegos;
        # --ftp-create-dirs crea la carpeta de FTP_DIR si hiciera falta.
        run: |
          # Si el secreto se pegó con Enter al final, GitHub guarda el salto de
          # línea y la URL queda partida (curl 3). Un nombre de servidor no
          # lleva espacios, así que se limpian sin riesgo.
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')

          # El `|| codigo=$?` es lo que evita que `bash -e` corte el paso antes
          # de poder explicar el error.
          codigo=0
          curl --fail --silent --show-error --ssl --ftp-pasv --ftp-create-dirs \
            --retry 3 --retry-delay 10 --max-time 900 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file release.zip \
            "ftp://$FTP_SERVER/${FTP_DIR}release.zip" || codigo=$?

          if [ "$codigo" -eq 0 ]; then
            echo "Paquete subido a ${FTP_DIR}release.zip."
            exit 0
          fi

          case "$codigo" in
            6) echo "FTP_SERVER no resuelve. Debe ser el nombre del servidor de"
               echo "Hostinger (algo.hstgr.io), no ftp.tudominio: el dominio apunta"
               echo "al CDN, que no habla FTP. Ver DEPLOY.md." ;;
            3) echo "FTP_SERVER trae caracteres que rompen la URL. Debe ser solo"
               echo "el nombre del servidor, sin ftp:// ni barras." ;;
            7) echo "FTP_SERVER resuelve pero no acepta la conexión en el puerto 21." ;;
            67) echo "Usuario o contraseña FTP rechazados. El usuario lleva su"
                echo "sufijo (algo.dominio) y la contraseña distingue mayúsculas." ;;
            60) echo "El certificado no valida: FTP_SERVER tiene una IP en vez del"
                echo "nombre del servidor (algo.hstgr.io), que es para quien está"
                echo "emitido el certificado." ;;
            *) echo "La subida falló. Ver DEPLOY.md, apartado 'Si algo falla'." ;;
          esac
          exit 1

      - name: Publicar en el servidor
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        # El servidor descomprime por tandas para no pasarse del tiempo máximo
        # de PHP; aquí se le llama hasta que responde done:true.
        run: |
          DEPLOY_URL=$(printf '%s' "$DEPLOY_URL" | tr -d '[:space:]')

          for intento in $(seq 1 60); do
            respuesta=$(curl --fail-with-body --silent --show-error --max-time 300 \
              -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              "${DEPLOY_URL%/}/deploy/release") || { echo "$respuesta"; exit 1; }
            echo "$respuesta"
            case "$respuesta" in
              *'"done":true'*) echo "Publicado."; exit 0 ;;
            esac
          done
          echo "El servidor no terminó de descomprimir en 60 llamadas."
          exit 1

      - name: Comprobar que la app responde en su carpeta
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        # Sin el .htaccess de la carpeta, el subdominio sirve la página por
        # defecto de Hostinger o un 403. Y si Laravel no reconoce su prefijo, la
        # ruta comodín de la SPA igual responde 200, así que se mira el prefijo
        # que informa la página: tiene que coincidir con el que se compiló.
        run: |
          DEPLOY_URL=$(printf '%s' "$DEPLOY_URL" | tr -d '[:space:]')
          html=$(curl --fail --silent --show-error --max-time 60 "${DEPLOY_URL%/}/login") \
            || { echo "${DEPLOY_URL%/}/login no responde. Ver DEPLOY.md, 'Si algo falla'."; exit 1; }
          case "$html" in
            *"name=\"base-path\" content=\"$ASSET_URL\""*) echo "La app responde en ${DEPLOY_URL%/}." ;;
            *) echo "La app responde, pero Laravel no se reconoce bajo '${ASSET_URL:-/}'."
               echo "Ver DEPLOY.md, 'Si algo falla'."
               exit 1 ;;
          esac
